<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <link rel="stylesheet" href="estilosSesion.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <header>
        <img src="img/control chiquito.png" width="80px" height="60px">
        <a href="/index.html"><h2>Score Game</h2></a>
    </header>

    <main>
        <section id="formUsuario">
            <section class="encabezado-form">
                <h2>Iniciar Sesión</h2>
                <p>Bienvenido de nuevo, ¡que bueno verte!</p>
            </section>
            <form >
                <Section id="gm" class="form">
                    <span class="material-symbols-outlined">mail</span>
                    <input type="email" id="email" placeholder="Ejemplo: a@agmail.com" >
                </Section>
                <Section id="pw" class="form">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="contrasena" placeholder="Introduce contraseña" minlength="9" maxlength="9">
                    
                </Section>

                <section class="opciones-extras">
                    <label class="recordar">
                        <input type="checkbox" id="recordarme"> Recordarme
                    </label>
                    <a href="#" class="olvido-pass">¿Olvidaste tu contraseña?</a>
                </section>

                <button type="submit" class="btn-sesion" onclick="iniciarSesion();">Iniciar Sesión</button>
            </form>


            <p class="enlace-login">
                ¿No tienes una cuenta? <a href="../Registro/indexRegistro.html">Registrate</a>
            </p>
        </section>

        <section id="imagenFormUsuario">
            <img src="img/inicio sesion.png" >
        </section>
    </main>
    <script src="form.js"></script>
</body>
</html>

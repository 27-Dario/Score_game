<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="#">
</head>
<body>
    <header>
        <h2>Score Game</h2>
    </header>

    <main>
        <section id="contenedor-login">
            <section id="formulario-login">
                <h2>Iniciar Sesión</h2>
                <p>Bienvenido de nuevo, ¡qué bueno verte!</p>
                
                <form>
                    <section class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo">
                    </section>
                    
                    <section class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password">
                    </section>

                    <section class="extra-opciones">
                        <label>
                            <input type="checkbox" name="recordarme"> Recordarme
                        </label>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </section>
                    
                    <section class="boton">
                        <button type="button">Iniciar Sesión</button>
                    </section>
                </form>

                <p class="o-texto">o</p>

                <section class="externo">
                    <button type="button">Continuar con Google</button>
                </section>

                <p class="enlace-registro">
                    ¿No tienes una cuenta? <a href="#">Regístrate</a>
                </p>
            </section>

            <aside id="imagen-login">
                <img src="ilustracion-login.png" alt="Ilustración de seguridad y videojuegos">
            </aside>
            
        </section>
    </main>
</body>
</html>
